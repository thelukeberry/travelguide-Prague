   NUMEROLOGIE-BERECHNUNG (exakt nach den Seelenformel-Regeln)

const VOWELS = { A:1, E:5, I:9, O:6, U:3, "Ä":1, "Ö":6, "Ü":3 };
const CONSONANTS = {
  B:2, C:3, D:4, F:6, G:7, H:8, J:1, K:2, L:3, M:4,
  N:5, P:7, Q:8, R:9, S:1, T:2, V:4, W:5, X:6, Y:7, Z:8
};
const MASTERS = new Set([11, 22, 33]);

function reduce(n, keepMaster = true) {
  while (n > 9 && !(keepMaster && MASTERS.has(n))) {
    n = String(n).split("").reduce((s, d) => s + (+d), 0);
  }
  return n;
}

function sumDigits(str) {
  return String(str).split("").reduce((s, c) => /\d/.test(c) ? s + (+c) : s, 0);
}

function lebenszahl(date) { // date = "YYYY-MM-DD"
  return reduce(sumDigits(date.replace(/-/g, "")));
}

function nameNumbers(name) {
  const clean = name.toUpperCase().replace(/ß/g, "S");
  let soul = 0, pers = 0;
  for (const ch of clean) {
    if (VOWELS[ch] !== undefined) soul += VOWELS[ch];
    else if (CONSONANTS[ch] !== undefined) pers += CONSONANTS[ch];
  }
  return { seele: reduce(soul), persoenlichkeit: reduce(pers), seeleRaw: soul, persRaw: pers };
}

function persoenlichesJahr(date, year) {
  const [, mm, dd] = date.split("-");
  return reduce(sumDigits(dd) + sumDigits(mm) + sumDigits(String(year)), false);
}

function schattenzahl(lz) {
  const base = reduce(lz, false); // auf eine Stelle für die Formel
  return 9 - (base - 1); // = 10 - base
}

function firstName(full) {
  return full.trim().split(/\s+/)[0] || full.trim();
}
function N(text, name) { return text.replace(/NAME/g, name); }

function tensionText(lz, sz, name) {
  const a = reduce(lz, false), b = reduce(sz, false);
  if (a === b) {
    return `Bei ${name} ziehen Lebenszahl und Seelenzahl am selben Strang — Weg und Sehnsucht sprechen dieselbe Sprache. Das ist selten, und es ist eine Gnade: ${name} muss sich nicht gegen sich selbst entscheiden.`;
  }
  const key = [Math.min(a,b), Math.max(a,b)].join("+");
  if (TENSIONS[key]) {
    return `In ${name} lebt ein Spannungsfeld: ${TENSIONS[key]} Es ist kein Fehler im System — es ist der Motor. ${name} ist nicht trotz dieser Spannung stark, sondern wegen ihr.`;

  const elA = MATRIX[lz].el, elB = MATRIX[sz].el;

  const [yy, mm, dd] = d.datum.split("-");
  const jahr = persoenlichesJahr(d.datum, d.jahr);

  const base = baseElement(el);
  const monthName = MONTHS[parseInt(mm,10)-1];

      ["Die Lebenszahl — dein Weg", `${name}, deine Lebenszahl ${lz} ist die ${lzM.a}, getragen vom Element ${el}. Sie steht für ${lzM.kw}. Das ist der Pfad, der in deinem Leben immer wiederkehrt — die Lektion, die in verschiedenen Kostümen anklopft, bis du sie umarmst. Wo andere geradeaus gehen, geht ${name} in Spiralen: immer dasselbe Thema, immer eine Windung höher.`],
      ["Die Seelenzahl — deine Sehnsucht", `Unter allem, was ${name} zeigt, sehnt sich die Seelenzahl ${sz} nach ${szM.kw}. Das ist, was du wirklich willst, ${name}, aber selten laut aussprichst. Es ist die Melodie, die du summst, wenn niemand zuhört — und das, wonach du dich zurücksehnst, kaum dass du es einmal berührt hast.`],
      ["Die Persönlichkeitszahl — deine Maske", `Was die Welt von ${name} sieht, trägt die Handschrift der ${pz} (${pzM.a}): ${pzM.kw}. Es ist die Tür, durch die andere eintreten — nicht das Haus dahinter. Manchmal, ${name}, fühlst du dich nicht wie das Bild, das andere von dir tragen. Genau diese Lücke zwischen Maske und Sehnsucht ist kein Makel; sie ist der Ort, an dem du wächst.`],
      ["Die Schicksalszahl — dein roter Faden", `Alle Buchstaben deines Namens zusammen ergeben die Schicksalszahl ${schicksal} (${skM.a}): ${skM.kw}. Das ist das Thema, dem ${name} nicht entkommt — der rote Faden, der sich durch jede Phase deines Lebens zieht, ob du ihn nun siehst oder nicht.`],
      ["Die Kraftzahl — dein verborgenes Geschenk", `Aus Lebenszahl und Seelenzahl entsteht deine Kraftzahl ${kraft} (${kraftM.a}). Sie ist die Synergie, die kaum jemand kennt — auch du nicht ganz, ${name}. Wenn dein Weg (${lz}) und deine Sehnsucht (${sz}) sich treffen, entsteht eine stille Vollmacht: ${kraftM.kw}. Das ist die Tür, die nur du öffnen kannst.`],
      ["Die Schattenzahl — dein blinder Fleck", `Deine Schattenzahl ist ${schatten}. Sie zeigt das Muster, das ${name} am meisten vermeidet — und am dringendsten braucht. ${schM ? "Im Gewand der "+schM.a+" verbirgt sich hier "+schM.sh+"." : ""} Nicht, um dich zu beschämen, ${name}, sondern um dich freizulassen: Was du im Schatten lässt, regiert dich. Was du anschaust, beginnt dir zu dienen.`],
      ["Das Spannungsfeld", tensionText(lz, sz, name)]
    ],
    koerper: {
      titel: `${name} — ${lzM.a} im Körper`,
      element: el,
      text: `${name}, dein Körper ist ein ${lzM.koerper}. Als ${el}-Wesen lebst du mit ${ELEMENT_BODY[base]}. Darum verhält sich dein Körper manchmal anders, als du erwartest: Er folgt nicht den Regeln, die für andere gelten, sondern dem Element, aus dem er gemacht ist. Dein Ziel — „${d.ziel}" — erreichst du nicht gegen diese Natur, ${name}, sondern mit ihr. Was wie ein Widerstand aussieht, ist oft nur dein ${el}, das nach seiner eigenen Sprache verlangt.`
    },
    ernaehrung: nut.items.map(t => N(t, name)),
    saboteur: N(nut.sab, name),
    bewegung: mov.map(t => N(t, name)),
    rhythmus: {
      morgen: `${name}, bevor du das erste Gerät berührst: zehn Minuten nur für deinen Körper. ${base==="Feuer"?"Etwas Kühles trinken, ein Fenster öffnen, drei tiefe Atemzüge in die Weite.":base==="Wasser"?"Etwas Warmes trinken, die Füsse auf den Boden, dem Körper Zeit zum Erwachen geben.":base==="Luft"?"Erst essen, dann denken — etwas Warmes, Geerdetes, bevor der Geist abhebt.":base==="Erde"?"Bewegung vor dem Frühstück, damit der stabile Stoffwechsel den Tag wach beginnt.":"In Stille spüren, was der Körper heute braucht, bevor die Welt es dir sagt."}`,
      mittag: `Deine energetisch stärkste Stunde liegt um die Mittagszeit, ${name}. Lege hierhin, was Mut verlangt — das schwierige Gespräch, die kreative Arbeit, die Entscheidung. Dein ${el} brennt jetzt am klarsten; verschwende diese Stunde nicht an Routine.`,
      abend: `Am Abend regeneriert ${name}s Kombination aus ${lz} und ${sz} am besten in ${base==="Feuer"?"bewusster Abkühlung — kein Bildschirm-Feuer mehr, sondern Wasser, Dämmerung, Stille.":base==="Wasser"?"Wärme und Rückzug — ein Bad, ein Buch, das langsame Loslassen des Tages.":base==="Luft"?"Erdung — Beine hoch, Magnesium, etwas, das den wandernden Geist landen lässt.":base==="Erde"?"leichter Bewegung und einer kleinen, frühen Mahlzeit, damit die Nacht wirklich Ruhe wird.":"einem festen kleinen Ritual, das deinem wandelbaren System sagt: Der Tag ist vollbracht."}`
    },
    prophezeiung: {
      thema: `Für ${name} steht ${d.jahr} im Zeichen des Persönlichen Jahres ${jahr}. ${N(YEAR_THEME[jahr], name)}`,
      detail: `Ein Kapitel endet, ${name}, und ein anderes hebt an. ${jahr<=3?"Was in den letzten Jahren schwer war, darf jetzt leichter werden — nicht weil die Last verschwindet, sondern weil du gewachsen bist.":jahr<=6?"Die Mitte eines Zyklus verlangt von dir Treue zu dem, was du begonnen hast — auch wenn der erste Glanz verflogen ist.":"Du stehst am Ende eines neunjährigen Bogens; was du jetzt loslässt, macht Platz für ein Leben, das dir ähnlicher sieht."}`,
      chance: `Die grösste Chance liegt dort, wo dein Ziel „${d.ziel}" und das Thema dieses Jahres sich berühren — und der entscheidende Moment naht um deinen Geburtsmonat ${monthName} herum, wenn dein persönlicher Rhythmus und das Jahr in Resonanz treten. Verpasse ihn nicht, ${name}: Was du in diesen Wochen säst, bestimmt die Ernte.`
    },
    geheime_staerke: `${name}, deine geheime Stärke ist die Verbindung von ${lzM.a} und ${szM.a}: Du kannst ${lzM.kw.split(",")[0].toLowerCase()} und ${szM.kw.split(",")[0].toLowerCase()} in derselben Hand halten, ohne dass eines das andere erdrückt. Kaum jemand sieht das. Du selbst manchmal auch nicht.`,
    botschaft: `Manches wartet ein Leben lang darauf, gesehen zu werden — und nennt sich erst dann beim Namen, wenn jemand hinschaut. ${name}, das Universum hat lange geschwiegen, um dir genau diesen einen Satz aufzuheben: Du warst nie zu viel und nie zu wenig — du warst immer genau die Frequenz, auf die alles andere noch wartet.`
  };
}

/* ============================================================
   RENDERING
   ============================================================ */

function esc(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render(r) {
  const n = r.numbers;
  const cards = [
    ["Lebenszahl", n.lz], ["Seelenzahl", n.sz], ["Persönlichkeit", n.pz],
    ["Schicksal", n.schicksal], ["Kraftzahl", n.kraft], ["Schatten", n.schatten],
    [`Pers. Jahr ${r.jahr_kalender}`, n.jahr], ["Monatszahl", n.monatszahl], ["Geburtstag", n.tagszahl]
  ].map(([k,v]) => `<div class="num-card"><span class="v">${v}</span><span class="k">${esc(k)}</span></div>`).join("");

  const sections = r.sections.map(([h, t]) =>
    `<div class="section"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join("");

  const ern = r.ernaehrung.map(t => `<div class="list-item">${esc(t)}</div>`).join("");
  const bew = r.bewegung.map(t => `<div class="list-item">${esc(t)}</div>`).join("");

  return `
    <p class="greeting">Für ${esc(r.name)} · ${esc(r.geschlecht)} · Ziel: ${esc(r.ziel)}</p>
    <h2>Deine Zahlen</h2>
    <div class="numbers">${cards}</div>

    <h2>Dein Brief</h2>
    <div class="section"><p>${esc(r.brief)}</p></div>

    <h2>Die Bedeutung deiner Zahlen</h2>
    ${sections}

    <h2>Dein Körper</h2>
    <div class="section">
      <h3>${esc(r.koerper.titel)} · Element ${esc(r.koerper.element)}</h3>
      <p>${esc(r.koerper.text)}</p>
    </div>

    <h2>Ernährung</h2>
    ${ern}
    <p class="saboteur"><strong>Dein stiller Saboteur:</strong> ${esc(r.saboteur)}</p>

    <h2>Bewegung</h2>
    ${bew}

    <h2>Dein Tagesrhythmus</h2>
    <div class="section"><h3>Morgen</h3><p>${esc(r.rhythmus.morgen)}</p></div>
    <div class="section"><h3>Mittag</h3><p>${esc(r.rhythmus.mittag)}</p></div>
    <div class="section"><h3>Abend</h3><p>${esc(r.rhythmus.abend)}</p></div>

    <h2>Die Prophezeiung · ${esc(String(r.jahr_kalender))}</h2>
    <div class="section"><h3>Das Thema des Jahres</h3><p>${esc(r.prophezeiung.thema)}</p></div>
    <div class="section"><h3>Was endet, was beginnt</h3><p>${esc(r.prophezeiung.detail)}</p></div>
    <div class="section"><h3>Deine grösste Chance</h3><p>${esc(r.prophezeiung.chance)}</p></div>

    <h2>Deine geheime Stärke</h2>
    <div class="section"><p>${esc(r.geheime_staerke)}</p></div>

    <h2>Die Botschaft</h2>
    <div class="botschaft">${esc(r.botschaft)}</div>
  `;
}

/* ============================================================
   FORM-HANDLING
   ============================================================ */

document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();
  const data = {
    name: document.getElementById("name").value.trim(),
    datum: document.getElementById("datum").value,
    geschlecht: document.getElementById("geschlecht").value,
    ziel: document.getElementById("ziel").value.trim(),
    jahr: new Date().getFullYear()
  };
  if (!data.name || !data.datum || !data.ziel) return;
  const report = buildReport(data);
  const out = document.getElementById("report");
  out.innerHTML = render(report);
  out.style.display = "block";
  out.scrollIntoView({ behavior: "smooth" });
});
</script>
</body>
</html>
